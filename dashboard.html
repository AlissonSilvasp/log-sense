<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>log-sense — Dashboard SOC</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #21262d;
    --ink: #e6edf3;
    --muted: #8b949e;
    --line: #30363d;
    --green: #2ea043;
    --green-bg: #1a3a2a;
    --amber: #d29922;
    --amber-bg: #3a2f1a;
    --red: #f85149;
    --red-bg: #3a1a1a;
    --blue: #58a6ff;
    --mono: "SF Mono", "Cascadia Code", "Consolas", "DejaVu Sans Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  header .logo {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, var(--green), var(--blue));
    color: #fff; font-weight: 800; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: 0.3px; }
  header .sub { color: var(--muted); font-size: 12px; margin-left: 8px; }
  .topbar {
    display: flex; gap: 16px; align-items: center;
    padding: 10px 18px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--line);
  }
  .topbar .stat { text-align: center; }
  .topbar .stat .num { font-family: var(--mono); font-size: 20px; font-weight: 700; }
  .topbar .stat .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .topbar .stat.idle .num { color: var(--muted); }
  .topbar .stat.active .num { color: var(--green); }
  .controls { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .btn {
    padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel-2); color: var(--ink); font-size: 13px; cursor: pointer;
    font-family: var(--sans); display: inline-flex; align-items: center; gap: 8px;
  }
  .btn:hover { background: var(--line); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.primary { background: var(--green); border-color: var(--green); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: #2d8a3e; }
  .btn.ai-on { background: var(--amber); border-color: var(--amber); color: #fff; }
  .main {
    display: flex; flex: 1; overflow: hidden;
    background: var(--bg);
  }
  .panel {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg);
  }
  .panel h2 {
    font-size: 13px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 1.5px; padding: 12px 16px; margin: 0;
    border-bottom: 1px solid var(--line);
  }
  .panel .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px 16px; margin-top: 12px;
  }
  .console {
    flex: 1; overflow: auto;
    background: #0a0c10;
    color: var(--muted); font-family: var(--mono); font-size: 12px;
    padding: 12px 16px; white-space: pre-wrap; word-break: break-word;
    border: 1px solid var(--line); border-radius: 10px; margin-top: 12px;
  }
  .artifact {
    flex: 1; display: flex; flex-direction: column;
    min-width: 340px; max-width: 560px;
    border: 1px solid var(--line); border-radius: 12px;
    overflow: hidden; background: var(--panel);
  }
  .artifact .head {
    padding: 14px 16px; background: var(--panel-2);
    display: flex; justify-content: space-between; align-items: center;
  }
  .artifact .head h3 { margin: 0; font-size: 13px; color: var(--muted); }
  .artifact .head .sev { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 6px; }
  .sev.h { background: var(--red-bg); color: var(--red); }
  .sev.m { background: var(--amber-bg); color: var(--amber); }
  .artifact .body { flex: 1; overflow: auto; padding: 12px 16px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; color: var(--ink); }
  .artifact .foot {
    padding: 8px 16px; background: var(--panel-2); font-size: 11px; color: var(--muted);
    display: flex; gap: 10px; align-items: center;
  }
  .artifact .foot a { color: var(--blue); text-decoration: none; }
  .artifact .foot a:hover { text-decoration: underline; }
  #filters { display: flex; gap: 8px; flex-wrap: wrap; margin-left: 12px; }
  #filters .btn {
    font-size: 12px; padding: 6px 12px; border-radius: 6px;
    background: var(--panel-3); border-color: var(--line);
  }
  #filters .btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }
  .main {
    display: flex; flex: 1; overflow: hidden;
    background: var(--bg);
  }
  .panel {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg);
  }
  .panel h2 {
    font-size: 13px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 1.5px; padding: 12px 16px; margin: 0;
    border-bottom: 1px solid var(--line);
  }
  .panel .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px 16px; margin-top: 12px;
  }
  .console {
    flex: 1; overflow: auto;
    background: #0a0c10;
    color: var(--muted); font-family: var(--mono); font-size: 12px;
    padding: 12px 16px; white-space: pre-wrap; word-break: break-word;
    border: 1px solid var(--line); border-radius: 10px; margin-top: 12px;
  }
  .alert-list {
    flex: 1; overflow: auto;
    display: flex; flex-direction: column; gap: 10px;
    padding: 12px 16px;
  }
  .alert-item {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 16px; cursor: pointer; transition: border-color .15s;
  }
  .alert-item:hover { border-color: var(--blue); }
  .alert-item .top { display: flex; gap: 10px; align-items: flex-start; }
  .alert-item .sev {
    font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 6px;
    min-width: 60px; text-align: center;
  }
  .sev.h { background: var(--red-bg); color: var(--red); }
  .sev.m { background: var(--amber-bg); color: var(--amber); }
  .sev.l { background: var(--blue); color: #fff; }
  .alert-item .body { font-family: var(--mono); font-size: 12px; color: var(--ink); white-space: pre-wrap; margin-top: 8px; line-height: 1.5; }
  .alert-item .meta { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
  .alert-item .meta span { margin-right: 12px; }
  .alert-empty {
    text-align: center; padding: 24px; color: var(--muted);
  }
  .chart-wrap {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px; margin-top: 12px; flex-shrink: 0;
  }
  .chart-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; }
  .chart-grid { display: flex; flex-direction: column; gap: 10px; }
  .chart-row { display: flex; align-items: center; gap: 12px; }
  .chart-bar-bg { flex: 1; height: 32px; background: var(--panel-3); border-radius: 4px; overflow: hidden; position: relative; }
  .chart-bar { height: 100%; border-radius: 4px; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; color: #fff; font-size: 11px; font-weight: 700; font-family: var(--mono); }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
  .chart-legend .item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .chart-legend .dot { width: 10px; height: 10px; border-radius: 50%; }
  .todo {
    text-align: center; padding: 24px; color: var(--muted); font-size: 13px;
  }
  .artifact {
    flex: 1; display: flex; flex-direction: column;
    min-width: 340px; max-width: 560px;
    border: 1px solid var(--line); border-radius: 12px;
    overflow: hidden; background: var(--panel);
  }
  .artifact .head {
    padding: 14px 16px; background: var(--panel-2);
    display: flex; justify-content: space-between; align-items: center;
  }
  .artifact .head h3 { margin: 0; font-size: 13px; color: var(--muted); }
  .artifact .head .sev { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 6px; }
  .sev.h { background: var(--red-bg); color: var(--red); }
  .sev.m { background: var(--amber-bg); color: var(--amber); }
  .sev.l { background: var(--blue); color: #fff; }
  .artifact .body { flex: 1; overflow: auto; padding: 12px 16px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; color: var(--ink); }
  .artifact .foot {
    padding: 8px 16px; background: var(--panel-2); font-size: 11px; color: var(--muted);
    display: flex; gap: 10px; align-items: center;
  }
  .artifact .foot a { color: var(--blue); text-decoration: none; }
  .artifact .foot a:hover { text-decoration: underline; }
  .badge {
    font-size: 12px; padding: 4px 9px; border-radius: 6px; font-family: var(--mono);
  }
  .badge.h { background: var(--red-bg); color: var(--red); }
  .badge.m { background: var(--amber-bg); color: var(--amber); }
  .spinner { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--line); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); padding: 10px 16px; border-radius: 8px; font-size: 13px; color: var(--ink); box-shadow: 0 4px 12px rgba(0,0,0,.4); z-index: 999; max-width: 90%; }
  .hide { display: none !important; }
  @media (max-width: 820px) {
    .main { flex-direction: column; }
    .artifact { min-width: 0; flex: 1; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">LS</div>
  <h1>log-sense <span class="sub">Blue Team — Painel de deteccao</span></h1>
</header>

<div class="topbar">
  <div class="stat idle" id="statEvents"><div class="num">0</div><div class="lbl">Eventos</div></div>
  <div class="stat idle" id="statAlerts"><div class="num">0</div><div class="lbl">Alertas</div></div>
  <div class="stat" id="statLog"><div class="num">—</div><div class="lbl">Log ativo</div></div>
  <div class="controls">
    <button class="btn" id="btnPick">📂 Selecionar log</button>
    <button class="btn primary" id="btnRun">▶ Rodar deteccao</button>
    <label class="btn" title="Usa IA para explicar (exige chave)">
      <input type="checkbox" id="chkAI" /> <span id="aiToggle">Ativar IA</span>
    </label>
    <div id="filters">
      <button class="btn active" data-severity="all">Todos</button>
      <button class="btn" data-severity="high">Alto</button>
      <button class="btn" data-severity="medium">Medio</button>
      <button class="btn" data-severity="low">Baixo</button>
    </div>
  </div>
</div>

<div class="main">
  <div class="panel">
    <h2>Alertas detectados</h2>
    <div class="card" id="badges"></div>
    <div class="alert-list" id="alertList"></div>
  </div>
  <div class="panel">
    <h2>Resumo por severidade</h2>
    <div class="chart-wrap">
      <div class="chart-title">Alertas por severidade</div>
      <div class="chart-grid" id="chartGrid"></div>
      <div class="chart-legend" id="chartLegend"></div>
    </div>
    <h2>Alertas por regra</h2>
    <div class="chart-wrap">
      <div class="chart-title">Maioria das regras ativas</div>
      <div class="chart-grid" id="rulesGrid"></div>
      <div class="chart-legend" id="rulesLegend"></div>
    </div>
  </div>
</div>

<div class="panel" id="artifactPanel" style="display:none;">
  <h2>Evolog de alerta</h2>
  <div class="card">
    <div class="artifact">
      <div class="head">
        <h3 id="artifactMeta"></h3>
        <a id="artifactDownload" href="#" download>Baixar relatorio</a>
      </div>
      <div class="body" id="artifactBody"></div>
    </div>
  </div>
</div>

<script>
const state = { events: 0, alerts: 0, log: "samples/log.txt", _ai: false, severityFilter: "all" };
const alertList = document.getElementById("alertList");
const chartGrid = document.getElementById("chartGrid");
const chartLegend = document.getElementById("chartLegend");
const rulesGrid = document.getElementById("rulesGrid");
const rulesLegend = document.getElementById("rulesLegend");

function setStatus(active) {
  document.querySelectorAll(".stat").forEach(s => s.classList.toggle("idle", !active));
  document.getElementById("btnRun").disabled = active;
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  return res.json();
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.opacity = "1";
  setTimeout(() => { t.style.opacity = "0"; }, 2500);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

async function run() {
  setStatus(true);
  const res = await fetch("/api/run", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ logs: state.log, ai: state._ai })
  });
  const data = await res.json();
  setStatus(false);
  if (!data.ok) { console.error(data); toast("Erro: " + data.error); return; }
  state.events = data.events; state.alerts = data.alerts;
  document.getElementById("statEvents").querySelector(".num").textContent = data.events;
  document.getElementById("statAlerts").querySelector(".num").textContent = data.alerts;
  document.getElementById("statLog").querySelector(".num").textContent = "log: " + state.log;
  paintBadges(data.details);
  renderAlertList(data.details);
  renderCharts(data.details, state.severityFilter);
  toast("Rodado com sucesso.");
}

function paintBadges(details) {
  document.getElementById("badges").innerHTML = "";
  if (!details.length) { document.getElementById("badges").innerHTML = `<div class="card">Nenhum alerta</div>`; return; }
  details.forEach(a => {
    const b = document.createElement("span");
    b.className = "badge " + a.severity;
    b.textContent = a.severity.toUpperCase() + " | " + a.rule + " | " + a.message;
    b.title = a.message;
    document.getElementById("badges").appendChild(b);
  });
}

function renderAlertList(details) {
  const filter = state.severityFilter;
  const filtered = filter === "all" ? details : details.filter(a => a.severity === filter);
  if (!filtered.length) {
    alertList.innerHTML = `<div class="alert-empty">Nenhum alerta nesta categoria.</div>`;
    return;
  }
  alertList.innerHTML = "";
  filtered.forEach(a => {
    const div = document.createElement("div");
    div.className = "alert-item";
    div.innerHTML = `
      <div class="top"><span class="sev ${a.severity}">${a.severity.toUpperCase()}</span></div>
      <div class="body">${escapeHtml(a.message)}</div>
      <div class="meta"><span>Rule: ${escapeHtml(a.rule)}</span><span>IP: ${escapeHtml(a.details?.[0]?.ip || "—")}</span></div>
    `;
    div.addEventListener("click", () => openEvolog(a));
    alertList.appendChild(div);
  });
}

function renderCharts(details) {
  const sevCounts = { high: 0, medium: 0, low: 0 };
  details.forEach(a => { if (sevCounts[a.severity] !== undefined) sevCounts[a.severity]++; });
  const maxSev = Math.max(1, ...Object.values(sevCounts));
  chartGrid.innerHTML = "";
  ["high", "medium", "low"].forEach(sev => {
    const row = document.createElement("div");
    row.className = "chart-row";
    row.innerHTML = `
      <div style="width: 80px; font-size: 12px; color: var(--muted);">${sev.charAt(0).toUpperCase() + sev.slice(1)}</div>
      <div class="chart-bar-bg"><div class="chart-bar" style="width: ${(sevCounts[sev] / maxSev) * 100}%; background: sev === 'high' ? '#f85149' : sev === 'medium' ? '#d29922' : '#58a6ff';">${sevCounts[sev]}</div></div>
      <div style="width: 40px; font-size: 12px; font-family: var(--mono); color: var(--ink);">${sevCounts[sev]}</div>
    `;
    chartGrid.appendChild(row);
  });

  chartLegend.innerHTML = "";
  const colors = { high: "#f85149", medium: "#d29922", low: "#58a6ff" };
  Object.keys(sevCounts).forEach(sev => {
    if (sevCounts[sev] > 0) {
      const item = document.createElement("div");
      item.className = "item";
      item.innerHTML = `<span class="dot" style="background: ${colors[sev]}"></span>${sev.charAt(0).toUpperCase() + sev.slice(1)}: ${sevCounts[sev]}`;
      chartLegend.appendChild(item);
    }
  });

  const ruleCounts = {};
  details.forEach(a => { ruleCounts[a.rule] = (ruleCounts[a.rule] || 0) + 1; });
  const topRules = Object.entries(ruleCounts).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const maxRule = topRules.length ? Math.max(...topRules.map(r => r[1])) : 1;
  rulesGrid.innerHTML = "";
  topRules.forEach(([rule, count]) => {
    const row = document.createElement("div");
    row.className = "chart-row";
    row.innerHTML = `
      <div style="width: 120px; font-size: 12px; color: var(--muted);">${escapeHtml(rule)}</div>
      <div class="chart-bar-bg"><div class="chart-bar" style="width: ${(count / maxRule) * 100}%; background: var(--blue);">${count}</div></div>
      <div style="width: 40px; font-size: 12px; font-family: var(--mono); color: var(--ink);">${count}</div>
    `;
    rulesGrid.appendChild(row);
  });

  rulesLegend.innerHTML = "";
  topRules.forEach(([rule, count]) => {
    const item = document.createElement("div");
    item.className = "item";
    item.innerHTML = `<span class="dot" style="background: var(--blue)"></span>${escapeHtml(rule)}: ${count}`;
    rulesLegend.appendChild(item);
  });
}

function openEvolog(alert) {
  const panel = document.getElementById("artifactPanel");
  const body = document.getElementById("artifactBody");
  const meta = document.getElementById("artifactMeta");
  body.textContent = `Regra: ${alert.rule}\nSeveridade: ${alert.severity}\nMensagem: ${alert.message}\n\nDetalhes:\n${JSON.stringify(alert.details, null, 2)}`;
  meta.textContent = `Evolog aberto - ${alert.rule}`;
  panel.style.display = "flex";
  document.getElementById("artifactDownload").href = "#";
}

document.addEventListener("click", (e) => {
  const btn = e.target.closest("#filters .btn");
  if (btn) {
    document.querySelectorAll("#filters .btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.severityFilter = btn.dataset.severity;
  }
});

document.getElementById("btnRun").addEventListener("click", run);
document.getElementById("chkAI").addEventListener("change", e => {
  state._ai = e.target.checked;
  document.getElementById("aiToggle").textContent = e.target.checked ? "Desativar IA" : "Ativar IA";
});

document.getElementById("btnPick").addEventListener("click", async () => {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".txt"; inp.multiple = false;
  inp.onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    // Leitura do arquivo para envio (payload JSON)
    let content = "";
    try { content = await file.text(); } catch (err) { toast("Erro ao ler arquivo: " + err); return; }
    const res = await fetch("/api/upload", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content })
    });
    const data = await res.json();
    if (data.ok) {
      state.log = data.path;  // caminho absoluto do arquivo no servidor
      document.getElementById("statLog").querySelector(".num").textContent = "log: " + file.name;
      run();
    } else {
      toast("Erro ao subir o arquivo: " + (data.error || "desconhecido"));
    }
  };
  inp.click();
});

window.addEventListener("DOMContentLoaded", async () => {
  try {
    const s = await api("/api/status");
    state.events = s.events; state.alerts = s.alerts; state.has_log = s.has_log;
    const numE = document.getElementById("statEvents").querySelector(".num");
    const numA = document.getElementById("statAlerts").querySelector(".num");
    const numL = document.getElementById("statLog").querySelector(".num");
    if (!state.has_log) {
      numE.textContent = "0"; numA.textContent = "0"; numL.textContent = "—";
      document.querySelectorAll(".stat").forEach(s => s.classList.add("idle"));
    } else {
      numE.textContent = s.events; numA.textContent = s.alerts;
      numL.textContent = "log: " + (s.log || "samples/log.txt");
    }
  } catch (e) { console.warn(e); }
});
</script>
</body>
</html>
