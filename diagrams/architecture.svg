    <br/>
    📊 Painel interativo<br/>
    (redes sociais verdes)<br/>
    <br/>
    📥 Download de<br/>
    relatórios como PDF
  </text>
  <rect x="770" y="300" width="380" height="30" rx="4" fill="#21262d" stroke="#2ea043" stroke-width="1" stroke-dasharray="6,2"/>
  <text x="960" y="320" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="12">
    📜 Relatório de incidentes
  </text>

  <!-- Legenda -->
  <rect x="30" y="560" width="460" height="130" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="55" y="585" fill="#60a5fa" font-family="monospace" font-size="14" font-weight="bold">
    🟦 Red Team — Gerador de logs controlado
  </text>
  <rect x="40" y="595" width="440" height="30" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="55" y="612" fill="#93c5fd" font-family="monospace" font-size="11">
    ✦ Simula ataques em ambiente isolado<br/>
    ✦ Testa regras de detecção<br/>
    ✦ Gerador de logs controlado
  </text>

  <rect x="510" y="560" width="460" height="130" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="525" y="585" fill="#fbbf24" font-family="monospace" font-size="14" font-weight="bold">
    ⚡ Sensor de Detecção (Blue)
  </text>
  <rect x="525" y="595" width="440" height="30" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="530" y="612" fill="#fcd34d" font-family="monospace" font-size="11">
    ✦ Parser + regras de assinatura<br/>
    ✦ AI triage (opcional)<br/>
    ✦ Geração de relatórios
  </text>

  <rect x="1000" y="560" width="460" height="130" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="1025" y="585" fill="#6ee7b7" font-family="monospace" font-size="14" font-weight="bold">
    🌐 Painel Web (Dashboard)
  </text>
  <rect x="1015" y="595" width="440" height="30" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="1020" y="612" fill="#bbf7d0" font-family="monospace" font-size="11">
    ✦ Interface web (http:8765)<br/>
    ✦ Painel interativo de alertas<br/>
    ✦ Download de relatórios
  </text>

  <!-- Legendas de cores -->
  <text x="40" y="555" fill="#3b82f6" font-family="monospace" font-size="13" font-weight="bold">
    🎨 Red (Coletor)
  </text>
  <text x="505" y="555" fill="#f59e0b" font-family="monospace" font-size="13" font-weight="bold">
    🎨 Yellow (Sensor)
  </text>
  <text x="1003" y="555" fill="#2ea043" font-family="monospace" font-size="13" font-weight="bold">
    🎨 Green (Dashboard)
  </text>

  <!-- Legenda na parte inferior -->
  <rect x="30" y="640" width="1140" height="55" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="600" y="665" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="12">
    🔐 log-sense — Blue Team Security Lab | Projeto construído para aprendizado e portfólio
  </text>
</svg>
