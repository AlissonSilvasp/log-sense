<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3a2a"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2a3a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect width="1200" height="700" fill="#0d1117" rx="8"/>

  <!-- Título -->
  <text x="600" y="40" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="22" font-weight="bold">
    🔒 log-sense — Arquitetura do Blue Team
  </text>
  <text x="600" y="60" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="16">
    Parser + Regras + Detecção + Relatório | Blue Team
  </text>

  <!-- Bloco do Coletor (Red) -->
  <rect x="20" y="100" width="320" height="180" rx="8" fill="#1a1a2e" stroke="#3b82f6" stroke-width="2"/>
  <rect x="20" y="100" width="320" height="30" rx="8" fill="#21262d"/>
  <text x="180" y="120" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="15" font-weight="bold">
    ✦ Coletor / Red Team
  </text>
  <rect x="30" y="140" width="290" height="130" rx="6" fill="#1a1a2e" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="165" y="165" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="13">
    📄 Gerador de logs<br/>
    (âmbito controlado)<br/>
    <br/>
    🔍 Fake login<br/>
    fake acesso<br/>
    <br/>
    ⚠️  Apenas local
  </text>
  <rect x="30" y="285" width="290" height="30" rx="4" fill="#21262d" stroke="#3b82f6" stroke-width="1" stroke-dasharray="6,2"/>
  <text x="175" y="305" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="12">
    🚀 Simula ataques (sem danos)
  </text>

  <!-- Setas para o sensor -->
  <line x1="180" y1="110" x2="430" y2="200" stroke="#3b82f6" stroke-width="2" marker-end="url(#blue)"/>
  <line x1="180" y1="115" x2="430" y2="250" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Bloco do Sensor (Yellow) -->
  <rect x="430" y="100" width="300" height="200" rx="8" fill="#1a1a2e" stroke="#f59e0b" stroke-width="2"/>
  <rect x="430" y="100" width="300" height="30" rx="8" fill="#21262d"/>
  <text x="580" y="120" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="15" font-weight="bold">
    ⚡ Sensor de Detecção (Blue)
  </text>
  <rect x="440" y="140" width="270" height="150" rx="6" fill="#1a1a2e" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="575" y="165" text-anchor="middle" fill="#fcd34d" font-family="monospace" font-size="12">
    🔍 Parser de logs (sensor.py)<br/>
    <br/>
    📜 Regras de assinatura<br/>
    • brute_force<br/>
    • sensitive_file_access<br/>
    • forbidden_command<br/>
    <br/>
    🧠 AI triage (opcional)
  </text>
  <rect x="440" y="300" width="270" height="30" rx="4" fill="#21262d" stroke="#f59e0b" stroke-width="1" stroke-dasharray="6,2"/>
  <text x="575" y="320" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="12">
    ⚡gera alertas + relatório
  </text>

  <!-- Setas para o report -->
  <line x1="530" y1="200" x2="760" y2="230" stroke="#f59e0b" stroke-width="2" marker-end="url(#green)"/>

  <!-- Bloco do Dashboard (Green) -->
  <rect x="760" y="100" width="420" height="200" rx="8" fill="#1a1a2e" stroke="#2ea043" stroke-width="2"/>
  <rect x="760" y="100" width="420" height="30" rx="8" fill="#21262d"/>
  <text x="970" y="120" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="15" font-weight="bold">
