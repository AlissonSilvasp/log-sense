  </text>
  <rect x="770" y="140" width="380" height="150" rx="6" fill="#1a1a2e" stroke="#2ea043" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="960" y="165" text-anchor="middle" fill="#bbf7d0" font-family="monospace" font-size="12">
