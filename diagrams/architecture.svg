<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690">
  <defs>
    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#8b949e"/>
    </marker>
  </defs>

  <title>Arquitetura do Log Sense</title>
  <desc>Fluxo de logs sintéticos, análise por regras e visualização de alertas no dashboard.</desc>
  <rect width="1200" height="690" rx="8" fill="url(#background)"/>

  <text x="600" y="40" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">
    Log Sense — Arquitetura do Blue Team
  </text>
  <text x="600" y="68" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    Geração de logs sintéticos, detecção e visualização de alertas
  </text>

  <rect x="30" y="105" width="340" height="235" rx="10" fill="#161b22" stroke="#3b82f6" stroke-width="2"/>
  <path d="M40 105 H360 Q370 105 370 115 V148 H30 V115 Q30 105 40 105" fill="#21262d"/>
  <text x="200" y="133" text-anchor="middle" fill="#60a5fa" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">
    Coletor / Red Team
  </text>
  <rect x="45" y="163" width="310" height="145" rx="6" fill="#0d1117" stroke="#3b82f6" stroke-dasharray="5 4"/>
  <text x="200" y="190" text-anchor="middle" fill="#c9d1d9" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    <tspan x="200">Gera logs sintéticos</tspan>
    <tspan x="200" dy="27">Simula eventos de login e acesso</tspan>
    <tspan x="200" dy="27">Executado em ambiente controlado</tspan>
    <tspan x="200" dy="27">Sem interação com sistemas externos</tspan>
  </text>
  <text x="200" y="328" text-anchor="middle" fill="#60a5fa" font-family="Segoe UI, Arial, sans-serif" font-size="13">
    Dados fictícios para estudo
  </text>

  <rect x="430" y="105" width="340" height="235" rx="10" fill="#161b22" stroke="#f59e0b" stroke-width="2"/>
  <path d="M440 105 H760 Q770 105 770 115 V148 H430 V115 Q430 105 440 105" fill="#21262d"/>
  <text x="600" y="133" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">
    Sensor de Detecção / Blue Team
  </text>
  <rect x="445" y="163" width="310" height="145" rx="6" fill="#0d1117" stroke="#f59e0b" stroke-dasharray="5 4"/>
  <text x="600" y="185" text-anchor="middle" fill="#c9d1d9" font-family="Segoe UI, Arial, sans-serif" font-size="14">
    <tspan x="600">Parser de logs (sensor.py)</tspan>
    <tspan x="600" dy="23">Regras de detecção:</tspan>
    <tspan x="600" dy="21">brute_force</tspan>
    <tspan x="600" dy="21">sensitive_file_access</tspan>
    <tspan x="600" dy="21">forbidden_command</tspan>
    <tspan x="600" dy="21">Triagem por IA opcional</tspan>
  </text>
  <text x="600" y="328" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="13">
    Gera alertas e relatórios
  </text>

  <rect x="830" y="105" width="340" height="235" rx="10" fill="#161b22" stroke="#2ea043" stroke-width="2"/>
  <path d="M840 105 H1160 Q1170 105 1170 115 V148 H830 V115 Q830 105 840 105" fill="#21262d"/>
  <text x="1000" y="133" text-anchor="middle" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">
    Painel Web / Dashboard
  </text>
  <rect x="845" y="163" width="310" height="145" rx="6" fill="#0d1117" stroke="#2ea043" stroke-dasharray="5 4"/>
  <text x="1000" y="190" text-anchor="middle" fill="#c9d1d9" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    <tspan x="1000">Acesso local: localhost:8765</tspan>
    <tspan x="1000" dy="27">Visualização de alertas</tspan>
    <tspan x="1000" dy="27">Gráficos interativos</tspan>
    <tspan x="1000" dy="27">Download de relatórios</tspan>
  </text>
  <text x="1000" y="328" text-anchor="middle" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13">
    Consulta dos resultados da análise
  </text>

  <line x1="375" y1="220" x2="420" y2="220" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="775" y1="220" x2="820" y2="220" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="600" y="382" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">
    Etapas do projeto
  </text>

  <rect x="30" y="402" width="360" height="175" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="434" fill="#60a5fa" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">
    1. Simulação controlada
  </text>
  <text x="50" y="469" fill="#c9d1d9" font-family="Segoe UI, Arial, sans-serif" font-size="14">
    <tspan x="50">Gera eventos fictícios para exercitar</tspan>
    <tspan x="50" dy="23">e validar as regras de detecção.</tspan>
  </text>

  <rect x="420" y="402" width="360" height="175" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="440" y="434" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">
    2. Análise e detecção
  </text>
  <text x="440" y="469" fill="#c9d1d9" font-family="Segoe UI, Arial, sans-serif" font-size="14">
    <tspan x="440">O sensor interpreta os logs, aplica</tspan>
    <tspan x="440" dy="23">regras e registra os alertas gerados.</tspan>
  </text>

  <rect x="810" y="402" width="360" height="175" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="830" y="434" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">
    3. Visualização
  </text>
  <text x="830" y="469" fill="#c9d1d9" font-family="Segoe UI, Arial, sans-serif" font-size="14">
    <tspan x="830">O dashboard apresenta os alertas</tspan>
    <tspan x="830" dy="23">e permite baixar os relatórios.</tspan>
  </text>

  <line x1="30" y1="615" x2="1170" y2="615" stroke="#30363d"/>
  <text x="600" y="647" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="14">
    Log Sense — projeto educacional de Blue Team, criado para aprendizado e portfólio
  </text>
</svg>
